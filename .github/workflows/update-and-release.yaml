name: Update and release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version without 'v' prefix
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # The tag is the only source of the version — the manifest is written from it —
      # so nothing downstream can disagree with a mistyped one. hassfest sees a
      # well-formed string and is satisfied, and HACS validates structure rather than
      # plausibility. v2028.8.2 was tagged in 2026 and every check passed.
      #
      # CalVer gives the year a correct answer, so it can be checked. A window of one
      # year either side allows a release tagged either side of midnight on 31 December
      # while still catching a slip of two years or more.
      - name: Sanity-check the version in the tag
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "Tag gives version: $VERSION"
          if ! echo "$VERSION" | grep -qE '^[0-9]{4}\.[0-9]{1,2}(\.[0-9]+)?(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION' is not YYYY.M[.P][-suffix] — expected CalVer, e.g. 2026.8.2 or 2026.8.2-beta"
            exit 1
          fi
          YEAR=$(echo "$VERSION" | cut -d. -f1)
          MONTH=$(echo "$VERSION" | cut -d. -f2)
          NOW_YEAR=$(date -u +%Y)
          if [ "$YEAR" -lt $((NOW_YEAR - 1)) ] || [ "$YEAR" -gt $((NOW_YEAR + 1)) ]; then
            echo "::error::Version year $YEAR is not within a year of $NOW_YEAR — mistyped tag?"
            exit 1
          fi
          if [ "$MONTH" -lt 1 ] || [ "$MONTH" -gt 12 ]; then
            echo "::error::Version month $MONTH is not a month"
            exit 1
          fi
          echo "Version $VERSION looks sane for $(date -u +%Y-%m)."

      - name: Set manifest.json version
        uses: jossef/action-set-json-field@v2
        with:
          file: custom_components/mspa/manifest.json
          field: version
          value: ${{ steps.get_version.outputs.VERSION }}

      - name: Commit the updated manifest and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add custom_components/mspa/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update manifest version to ${{ steps.get_version.outputs.VERSION }}"
            # Push to the current branch (not hardcoded to main)
            git push origin HEAD:${{ github.event.release.target_commitish }}
          fi

          # Move the tag to this commit and force-push
          git tag -f ${{ github.ref_name }}
          git push origin ${{ github.ref_name }} --force

  release:
    needs: update-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: echo "(zipped artifact)" > ${{ github.workspace }}/custom_components/mspa/README.md
        
      # Pack the MSPA dir as a zip and upload to the release
      - name: 📦 ZIP MSPA Dir
        run: |
          cd ${{ github.workspace }}/custom_components/mspa
          zip mspa.zip -r ./

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/custom_components/mspa/mspa.zip
